name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # SEC-07 : analyse des secrets dans tout l'historique, dans un job séparé
  # (ses rapports ne doivent pas se retrouver dans le dossier contrôlé par Prettier).
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: civora_owner
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: civora
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_MIGRATOR: postgres://civora_owner:ci@localhost:5432/civora
      DATABASE_URL: postgres://civora_app:ci@localhost:5432/civora
      DATABASE_URL_READONLY_BI: postgres://civora_bi:ci@localhost:5432/civora
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Prettier
        run: |
          git status --short
          pnpm format:check
      - run: pnpm typecheck
      - run: pnpm db:migrate
      - name: Mots de passe des rôles applicatifs (CI uniquement)
        run: |
          PGPASSWORD=ci psql -h localhost -U civora_owner -d civora \
            -c "ALTER ROLE civora_app PASSWORD 'ci'" -c "ALTER ROLE civora_bi PASSWORD 'ci'"
      - run: pnpm test
      - run: pnpm check:requirements
